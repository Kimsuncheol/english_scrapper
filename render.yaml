# Inference runs on Ollama Cloud. This Free web service loads no OCR models.
# The Docker CMD runs scripts/start.sh; no separate build/start override needed.
services:
  - type: web
    name: english-scrapper
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: english-scrapper
      - key: FIRESTORE_DATABASE
        value: "(default)"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
      - key: OLLAMA_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: SCRAPE_MAX_CONCURRENT_REQUESTS
        value: "1"
      - key: SCRAPE_TIMEOUT_SECONDS
        value: "90"
      - key: OCR_MAX_PIXELS
        value: "4000000"
      - key: SCRAPE_ENABLED
        value: "false"
      # The external scheduler owns the clock; no timer runs in a Free web process.
      - key: SCRAPE_IN_PROCESS
        value: "false"
      - key: SCRAPE_TIMEZONE
        value: Asia/Seoul
      - key: SCRAPE_HOUR
        value: "6"
      - key: SCRAPE_MINUTE
        value: "0"
# Configure FIREBASE_PROJECT_ID and FIRESTORE_DATABASE in the dashboard.
# Mount service-account.json as a Render secret file and set
# GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/service-account.json.
# SCRAPE_TRIGGER_TOKEN enables external triggers. No Firebase project is provisioned.
