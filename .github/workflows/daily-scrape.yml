name: Daily Chosun lesson scrape
on:
  schedule:
    # 23:00 Asia/Seoul, Monday through Friday (14:00 UTC).
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-chosun-scrape
  cancel-in-progress: false
jobs:
  wake-and-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch and verify the latest published expression
        run: python3 scripts/check_latest.py
